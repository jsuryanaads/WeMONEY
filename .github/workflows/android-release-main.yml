name: WeMONEY Android Release

on:
  workflow_run:
    workflows: ["We MONEY Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Android Production Release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout verified Web release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Android release target: android-v$VERSION"

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Validate release secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify WeMONEY icon source
        run: |
          set -euo pipefail
          test -s resources/icon.png
          file resources/icon.png
          echo "Using WeMONEY master icon: resources/icon.png"

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Generate Capacitor Android
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android --iconBackgroundColor '#07152f' --iconBackgroundColorDark '#07152f'

      - name: Verify generated Android launcher icon
        run: |
          set -euo pipefail
          test -d android/app/src/main/res
          test -n "$(find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher_foreground.png' \) -print -quit)"
          echo "Generated Android launcher resources:"
          find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher_foreground.png' \) -print | sort

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/wemoney-release.keystore
          cat >> android/gradle.properties <<EOF
          WEMONEY_STORE_FILE=$GITHUB_WORKSPACE/android/wemoney-release.keystore
          WEMONEY_STORE_PASSWORD=$KEYSTORE_PASSWORD
          WEMONEY_KEY_ALIAS=$KEY_ALIAS
          WEMONEY_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {\n"
          signing = """    signingConfigs {
              release {
                  storeFile file(project.property("WEMONEY_STORE_FILE"))
                  storePassword project.property("WEMONEY_STORE_PASSWORD")
                  keyAlias project.property("WEMONEY_KEY_ALIAS")
                  keyPassword project.property("WEMONEY_KEY_PASSWORD")
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace(marker, signing + marker, 1)
          pos = s.find(marker)
          release_pos = s.find("        release {\n", pos)
          if release_pos < 0:
              raise SystemExit("release buildType not found")
          block = s[release_pos:release_pos + 500]
          if "signingConfig signingConfigs.release" not in block:
              insert = release_pos + len("        release {\n")
              s = s[:insert] + "            signingConfig signingConfigs.release\n" + s[insert:]
          p.write_text(s)
          PY

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="android-v$VERSION"
          TITLE="WeMONEY Android v$VERSION"
          NOTES="WeMONEY Android v$VERSION

          - Public Android release
          - Capacitor Android build
          - WeMONEY icon source: resources/icon.png
          - Signed release APK
          - Signed release AAB

          Web release v$VERSION remains separate."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              android/app/build/outputs/apk/release/app-release.apk \
              android/app/build/outputs/bundle/release/app-release.aab \
              --clobber
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "$TITLE" \
              --latest=false \
              --notes "$NOTES" \
              android/app/build/outputs/apk/release/app-release.apk \
              android/app/build/outputs/bundle/release/app-release.aab
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f android/wemoney-release.keystore
