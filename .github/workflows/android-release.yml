name: WeMONEY Android Release Build

on:
  push:
    branches: [android-capacitor]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

jobs:
  release:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Validate Supabase environment
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Build web application for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Prepare WeMONEY Android icon source
        run: |
          set -euo pipefail
          mkdir -p assets
          cp src/assets/branding/wemoney-app-icon.png assets/icon.png

      - name: Generate Android project
        run: |
          set -euo pipefail
          if [ -d android ]; then
            echo "android/ already exists in repository; reusing persisted Android project"
          else
            npx cap add android
          fi

      - name: Generate Android icon from WeMONEY logo
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#07152f' --iconBackgroundColorDark '#07152f'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android signing
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/wemoney-release.keystore
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/wemoney-release.keystore"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          marker = '    buildTypes {\n'
          if marker not in text:
              raise SystemExit('Could not locate buildTypes in android/app/build.gradle')
          signing = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in text:
              text = text.replace(marker, signing + marker, 1)
          release_marker = '        release {\n'
          pos = text.find(marker)
          release_pos = text.find(release_marker, pos)
          if release_pos < 0:
              raise SystemExit('Could not locate release buildType')
          if 'signingConfig signingConfigs.release' not in text[release_pos:release_pos + 300]:
              insert_at = release_pos + len(release_marker)
              text = text[:insert_at] + '            signingConfig signingConfigs.release\n' + text[insert_at:]
          p.write_text(text)
          PY

      - name: Build signed release APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        working-directory: android
        run: |
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/wemoney-release.keystore"
          ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        working-directory: android
        run: |
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/wemoney-release.keystore"
          ./gradlew bundleRelease --no-daemon

      - name: Build unsigned release APK
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build unsigned release AAB
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload signed release APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeMONEY-Android-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeMONEY-Android-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeMONEY-Android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeMONEY-Android-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish public Android GitHub Release
        if: env.ANDROID_SIGNING_ENABLED == 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-android-release]')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-v1.4.19
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          git push origin ":refs/tags/$RELEASE_TAG" 2>/dev/null || true
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "WeMONEY Android v1.4.19"
          git push origin "$RELEASE_TAG"
          cat > /tmp/wemoney-android-release-notes.md <<'EOF'
          WeMONEY Android v1.4.19

          - Public Android release
          - Capacitor Android project persisted in the android-capacitor branch
          - Native Camera/OCR integration
          - Signed release APK
          - Signed release AAB
          - Validated on a real Android device

          Web release v1.4.19 remains separate.
          EOF
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "WeMONEY Android v1.4.19" \
            --notes-file /tmp/wemoney-android-release-notes.md \
            --latest=false
          gh release upload "$RELEASE_TAG" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --clobber

      - name: Remove temporary keystore
        if: always()
        run: rm -f android/wemoney-release.keystore
