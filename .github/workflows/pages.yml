name: We MONEY Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate environment
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: npm run build
      - name: Restore PWA master icon path
        run: |
          set -euo pipefail
          test -s src/assets/branding/wemoney-app-icon.png
          mkdir -p dist/assets/branding
          cp src/assets/branding/wemoney-app-icon.png dist/assets/branding/wemoney-app-icon.png
          test -s dist/assets/branding/wemoney-app-icon.png
      - name: Verify artifact
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/assets/branding/wemoney-app-icon.png
          grep -q 'We MONEY' dist/index.html
          grep -q '/WeMONEY/assets/branding/wemoney-app-icon.png' dist/manifest.webmanifest
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --max-time 45 "$PAGE_URL" -o /tmp/index.html
          grep -q 'We MONEY' /tmp/index.html
          grep -q 'manifest.webmanifest' /tmp/index.html
          MANIFEST_URL="${PAGE_URL%/}/manifest.webmanifest"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --max-time 45 "$MANIFEST_URL" -o /tmp/manifest.webmanifest
          grep -q '"name": "We MONEY"' /tmp/manifest.webmanifest
          grep -q '"start_url": "/WeMONEY/"' /tmp/manifest.webmanifest
          ICON_URL="${PAGE_URL%/}/assets/branding/wemoney-app-icon.png"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --max-time 45 "$ICON_URL" -o /tmp/wemoney-app-icon.png
          test -s /tmp/wemoney-app-icon.png
          echo 'We MONEY Pages deployment + production verification: PASS'
