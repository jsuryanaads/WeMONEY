name: We MONEY Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
            exit 0
          fi

          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s' "$PREVIOUS_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:'- %s' -20)
          fi

          gh release create "$TAG" \
            --target main \
            --title "We MONEY V${VERSION}" \
            --notes "## We MONEY V${VERSION}\n\n### Changelog\n${CHANGELOG}\n\n### Checkpoint\n- Version: V${VERSION}\n- Branch: main\n- Commit: ${GITHUB_SHA}\n\n### Branding\n**We MONEY** — Catat Uangmu, Rencanakan Masa Depanmu"
