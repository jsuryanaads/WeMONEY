name: We MONEY Release

on:
  workflow_run:
    workflows: ["We MONEY Pages Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release after verified deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate release version format
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
            exit 0
          fi

          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s' "$PREVIOUS_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:'- %s' -20)
          fi

          gh release create "$TAG" \
            --target main \
            --title "We MONEY V${VERSION}" \
            --notes "## We MONEY V${VERSION}\n\n### Changelog\n${CHANGELOG}\n\n### Checkpoint\n- Version: V${VERSION}\n- Branch: main\n- Commit: ${GITHUB_SHA}\n- Pages deployment: verified before release\n\n### Branding\n**We MONEY** — Catat Uangmu, Rencanakan Masa Depanmu"
